spring.application.name=booking-service
server.port=8084

spring.datasource.url=${BOOKING_DATABASE_URL:jdbc:mysql://localhost:3306/booking_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:cinema}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:cinema}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=3000

# Địa chỉ các service mà booking-service gọi tới
services.movie.url=http://localhost:8082
services.venue.url=http://localhost:8083

# PHẢI GIỐNG HỆT ở mọi service, dài ít nhất 32 ký tự
jwt.secret=${JWT_SECRET}

cinema.seat-hold-seconds=${SEAT_HOLD_SECONDS:600}
cinema.zone-id=${CINEMA_ZONE_ID:Asia/Ho_Chi_Minh}

# Timeout / retry khi gọi movie-service và venue-service
services.timeout.connect-ms=${SERVICE_CONNECT_TIMEOUT_MS:2000}
services.timeout.read-ms=${SERVICE_READ_TIMEOUT_MS:3000}
services.retry.max-attempts=${SERVICE_RETRY_ATTEMPTS:3}
services.retry.backoff-ms=${SERVICE_RETRY_BACKOFF_MS:200}
