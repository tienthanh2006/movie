spring.application.name=user-service
server.port=8081

spring.datasource.url=${USER_DATABASE_URL:jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:cinema}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

# PHẢI GIỐNG HỆT ở mọi service, dài ít nhất 32 ký tự
jwt.secret=${JWT_SECRET}

cinema.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
cinema.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
cinema.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
